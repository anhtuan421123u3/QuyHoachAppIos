name: Build iOS IPA (Sideloadly)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release App (Unsigned ARM64)
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/ios-build"
          IPA_DIR="$RUNNER_TEMP/ipa-output"

          xcodebuild build \
            -project "QuyHoachIos/QuyHoachIos.xcodeproj" \
            -target "QuyHoachIos" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$BUILD_DIR" \
            OBJROOT="$BUILD_DIR/Intermediates" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="$BUILD_DIR/Release-iphoneos/QuyHoachIos.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$BUILD_DIR" -name "QuyHoachIos.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Không tìm thấy QuyHoachIos.app sau khi biên dịch!"
            exit 1
          fi

          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/QuyHoachIos.app"

          cd "$IPA_DIR"
          zip -r -y "QuyHoachIos.ipa" Payload
          rm -rf Payload

          ls -lh "$IPA_DIR/QuyHoachIos.ipa"

          {
            echo "### Build IPA thành công!"
            echo "- **File**: \`QuyHoachIos.ipa\` (Unsigned ARM64 cho Sideloadly / AltStore)"
            echo "- **Hướng dẫn**: Tải Artifact \`QuyHoachIos-IPA\` bên dưới, **giải nén file .zip** để lấy \`QuyHoachIos.ipa\`, sau đó kéo thả vào **Sideloadly**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuyHoachIos-IPA
          path: ${{ runner.temp }}/ipa-output/QuyHoachIos.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish IPA to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ipa-output/QuyHoachIos.ipa
          generate_release_notes: true
